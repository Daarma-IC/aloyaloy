name: NusaMesh
options:
  bundleIdPrefix: id.nusamesh
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: id.nusamesh.app
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
targets:
  NusaMesh:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Meshta
        NSBluetoothAlwaysUsageDescription: Meshta memakai Bluetooth untuk membentuk jaringan mesh dengan HP sekitar dan NusaNode.
        NSBluetoothPeripheralUsageDescription: Meshta memakai Bluetooth agar HP lain dapat menyambung dan meneruskan pesan lewat HP ini.
        NSMicrophoneUsageDescription: Meshta memakai mikrofon untuk merekam voice note.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
    preBuildScripts:
      - name: Build ComposeApp framework
        script: |
          cd "$SRCROOT/.."
          sh ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

